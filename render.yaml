services:
  - type: web
    name: mini-dmart-backend
    env: python
    buildCommand: cd backend && pip install -r requirements/production.txt && python manage.py migrate && python manage.py seed_data
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOW_ALL_ORIGINS
        value: True
      - key: DATABASE_URL
        sync: false
